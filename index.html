
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salalah Health City</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Open+Sans:wght@400;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'health-blue': 'var(--health-blue)',
              'health-green': 'var(--health-green)',
              'health-background': 'var(--health-background)',
              'health-alert': 'var(--health-alert)',
              'text-primary': 'var(--text-primary)',
              'text-secondary': 'var(--text-secondary)',
              'surface-primary': 'var(--surface-primary)',
              'surface-secondary': 'var(--surface-secondary)',
              'border-color': 'var(--border-color)',
            },
            fontFamily: {
              sans: ['Open Sans', 'Noto Sans Arabic', 'sans-serif'],
              heading: ['Inter', 'Tajawal', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <style>
      :root {
        --health-blue: #1A4D8F;
        --health-green: #00A896;
        --health-background: #F6F8FA;
        --health-alert: #E63946;
        --text-primary: #1F2937;
        --text-secondary: #4B5563;
        --surface-primary: #FFFFFF;
        --surface-secondary: #F9FAFB;
        --border-color: #E5E7EB;

        --font-size-base: 1rem;
        --font-size-lg: 1.125rem;
        --font-size-xl: 1.25rem;
        --font-size-2xl: 1.5rem;
        --font-size-3xl: 1.875rem;
        --font-size-4xl: 2.25rem;
        --font-size-5xl: 3rem;
        --font-size-6xl: 3.75rem;
      }

      .large-text {
        --font-size-base: 1.125rem;
        --font-size-lg: 1.25rem;
        --font-size-xl: 1.5rem;
        --font-size-2xl: 1.875rem;
        --font-size-3xl: 2.25rem;
        --font-size-4xl: 2.8rem;
        --font-size-5xl: 3.75rem;
        --font-size-6xl: 4.5rem;
      }

      .high-contrast {
        --health-blue: #0056b3;
        --health-green: #007a70;
        --health-background: #000000;
        --health-alert: #d93025;
        --text-primary: #FFFFFF;
        --text-secondary: #E0E0E0;
        --surface-primary: #121212;
        --surface-secondary: #1E1E1E;
        --border-color: #444444;
      }
      
      html {
        scroll-behavior: smooth;
        overflow-x: hidden;
      }

      body {
        background-color: var(--health-background);
        color: var(--text-primary);
        font-size: var(--font-size-base);
        transition: background-color 0.3s, color 0.3s;
        cursor: none;
        overflow-x: hidden;
        width: 100%;
        max-width: 100vw;
      }
      
      body, a, button, [role="button"], input, textarea, select {
        cursor: none;
      }
      
      a:hover, button:hover {
        cursor: none;
      }

      /* Base typography */
      p, li, span, div { font-size: var(--font-size-base); }
      h6 { font-size: var(--font-size-lg); }
      h5 { font-size: var(--font-size-xl); }
      h4 { font-size: var(--font-size-2xl); }
      h3 { font-size: var(--font-size-3xl); }
      h2 { font-size: var(--font-size-4xl); }
      h1 { font-size: var(--font-size-5xl); }
      
      /* Accessibility Focus Ring */
      :focus-visible {
        outline: 3px solid var(--health-blue);
        outline-offset: 2px;
        border-radius: 4px;
      }
      .high-contrast :focus-visible {
        outline: 3px solid #FFFF00;
      }

      :lang(en) { font-family: 'Open Sans', sans-serif; }
      :lang(ar) { font-family: 'Noto Sans Arabic', sans-serif; }
      :lang(en) h1, :lang(en) h2, :lang(en) h3, :lang(en) h4, :lang(en) h5, :lang(en) h6 { font-family: 'Inter', sans-serif; }
      :lang(ar) h1, :lang(ar) h2, :lang(ar) h3, :lang(ar) h4, :lang(ar) h5, :lang(ar) h6 { font-family: 'Tajawal', sans-serif; }
      
      /* Skip to content link */
      .skip-to-content {
        position: absolute;
        left: -9999px;
        top: auto;
        width: 1px;
        height: 1px;
        overflow: hidden;
        z-index: -9999;
      }
      .skip-to-content:focus, .skip-to-content:active {
        position: fixed;
        top: 10px;
        left: 10px;
        width: auto;
        height: auto;
        overflow: auto;
        padding: 1rem;
        background: var(--health-blue);
        color: white;
        z-index: 10000;
        border-radius: 8px;
        font-weight: bold;
        text-decoration: none;
      }
      
      /* Page Transitions */
      @keyframes page-fade-in-up {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .page-transition {
        animation: page-fade-in-up 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }
      
      /* Scroll Animations */
      .animate-on-scroll {
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 0.8s ease-out, transform 0.8s ease-out;
      }
      .animate-on-scroll.is-visible {
        opacity: 1;
        transform: translateY(0);
      }
      
      /* Custom Cursor */
      .custom-cursor .cursor-dot, .custom-cursor .cursor-outline {
        position: fixed;
        top: 0;
        left: 0;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transition: transform 0.2s, opacity 0.2s, width 0.3s, height 0.3s;
      }
      .custom-cursor .cursor-dot {
        width: 8px;
        height: 8px;
        background-color: var(--health-blue);
      }
      .custom-cursor .cursor-outline {
        width: 40px;
        height: 40px;
        border: 2px solid var(--health-blue);
        opacity: 0.5;
      }
      .custom-cursor--hovered .cursor-outline {
        transform: translate(-50%, -50%) scale(1.5);
        opacity: 0.2;
      }
      .custom-cursor--hovered .cursor-dot {
        opacity: 0;
      }
      
      .reduce-motion .custom-cursor {
        display: none;
      }
      .reduce-motion body, .reduce-motion a, .reduce-motion button {
        cursor: auto;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.3.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
